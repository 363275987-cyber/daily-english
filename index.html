<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>龙哥英语 · 每日背诵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#2ecc71;--d:#1a1a2e;--c:#16213e;--t:#eee;--m:#8892b0;--r:#e74c3c;--gold:#f39c12;--b:#3498db}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:var(--d);color:var(--t);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.top h1{font-size:18px;font-weight:700}.top h1 em{color:var(--g);font-style:normal}
.tabs{display:flex;overflow-x:auto;padding:0 12px 12px;gap:6px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;border:none;background:rgba(255,255,255,.08);color:var(--m);transition:all .2s}
.tab.on{background:var(--g);color:#000}
.pbar{padding:0 16px;margin-bottom:10px}.pbar-i{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.pbar-f{height:100%;background:var(--g);border-radius:2px;transition:width .4s}
.pt{font-size:11px;color:var(--m);margin-top:3px;text-align:right}
.card{margin:0 12px 10px;background:var(--c);border-radius:14px;padding:16px}
.st{font-size:14px;color:var(--gold);font-weight:600;margin-bottom:3px}
.sl{font-size:11px;color:var(--m);margin-bottom:8px}
.en{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:10px}
.cn{font-size:13px;color:var(--m);line-height:1.4;margin-bottom:12px;padding:8px;background:rgba(255,255,255,.04);border-radius:6px;border-left:3px solid var(--g)}
.vt{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:4px}
.vi{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.vw{font-weight:600}.vp{color:var(--b);margin-left:3px;font-size:11px}.vm{color:var(--m)}
.bs{display:flex;gap:8px;margin:10px 0}
.b{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.b:active{transform:scale(.96)}
.bg{background:var(--g);color:#000}
.bb{background:rgba(52,152,219,.2);color:var(--b);border:1px solid var(--b)}
.br{background:rgba(231,76,60,.12);color:var(--r);border:1px solid var(--r)}
.rb{padding:10px;border-radius:6px;font-size:13px;margin:6px 0;display:none}
.rb.s{display:block}
.rb.ok{background:rgba(46,204,113,.1);border:1px solid var(--g);color:var(--g)}
.rb.no{background:rgba(231,76,60,.1);border:1px solid var(--r);color:#e8a0a0}
.nav{display:flex;gap:8px;margin-top:4px}
.dn{text-align:center;padding:24px 16px}.dn i{font-size:48px}.dn h2{font-size:18px;margin:8px 0 4px}.dn p{color:var(--m);font-size:13px}
.tip{margin:0 12px 10px;padding:8px 12px;background:rgba(243,156,18,.08);border-radius:6px;border-left:3px solid var(--gold);font-size:11px;color:#ccc;line-height:1.4}
</style>
</head>
<body>
<div id="a"></div>
<script>
var B='https://363275987-cyber.github.io/daily-english/audio/';
// Day 1 uses old naming s0-s7, Day 2-7 use d{day}_g{group}
function aUrl(d,g,sp){
  if(d===1)return B+'s'+g+'_'+sp+'.mp3';
  return B+'d'+d+'_'+g+'_'+sp+'.mp3';
}

var D=[
{id:1,title:"The Question",g:[
{en:'A young man asked a master, "How long will it take me to become great?"',cn:'一个年轻人问一位大师：我要多久才能成为高手？',v:[{w:'master',p:'/ˈmæstər/',m:'大师，高手'},{w:'become',p:'/bɪˈkʌm/',m:'成为'}]},
{en:'The master said, "Ten years."',cn:'大师说：十年。',v:[{w:'said',p:'/sed/',m:'说（过去式）'}]},
{en:'The young man said, "That is too long. What if I practice twice as hard?"',cn:'年轻人说：太久了。如果我加倍努力呢？',v:[{w:'twice',p:'/twaɪs/',m:'两倍'},{w:'hard',p:'/hɑːrd/',m:'努力'}]},
{en:'The master smiled. "Then it will take twenty years."',cn:'大师笑了：那就需要二十年。',v:[{w:'smiled',p:'/smaɪld/',m:'微笑（过去式）'},{w:'twenty',p:'/ˈtwenti/',m:'二十'}]},
{en:'The young man was confused. "Why does more effort take longer?"',cn:'年轻人困惑了：为什么越努力反而越久？',v:[{w:'confused',p:'/kənˈfjuːzd/',m:'困惑'},{w:'effort',p:'/ˈefərt/',m:'努力'}]},
{en:'The master said, "When you rush, you do not see your mistakes."',cn:'大师说：你急躁的时候，看不到自己的错误。',v:[{w:'rush',p:'/rʌʃ/',m:'急躁，赶'},{w:'mistakes',p:'/mɪˈsteɪks/',m:'错误'}]},
{en:'You practice the wrong way a thousand times, and it becomes a habit.',cn:'你用错误的方式练一千遍，它就成了习惯。',v:[{w:'thousand',p:'/ˈθaʊzənd/',m:'一千'},{w:'habit',p:'/ˈhæbɪt/',m:'习惯'}]},
{en:'A bad habit is harder to fix than no habit at all.',cn:'坏习惯比没有习惯更难改。',v:[{w:'fix',p:'/fɪks/',m:'修正'}]}
]},
{id:2,title:"The Lesson Begins",g:[
{en:'The young man stayed with the master.',cn:'年轻人留在了大师身边。',v:[{w:'stayed',p:'/steɪd/',m:'留下（过去式）'}]},
{en:'Every morning, he practiced alone before sunrise.',cn:'每天早上，他在日出前独自练习。',v:[{w:'sunrise',p:'/ˈsʌnraɪz/',m:'日出'},{w:'alone',p:'/əˈloʊn/',m:'独自'}]},
{en:'He repeated the same simple move a hundred times.',cn:'他重复同一个简单的动作一百遍。',v:[{w:'repeated',p:'/rɪˈpiːtɪd/',m:'重复（过去式）'},{w:'simple',p:'/ˈsɪmpəl/',m:'简单的'}]},
{en:'"Why only this one move?" he asked.',cn:'他问：为什么只练这一个动作？',v:[{w:'move',p:'/muːv/',m:'动作'}]},
{en:'"Because this one move is the foundation," the master said.',cn:'大师说：因为这一个动作是基础。',v:[{w:'foundation',p:'/faʊnˈdeɪʃn/',m:'基础'},{w:'because',p:'/bɪˈkɔːz/',m:'因为'}]},
{en:'"Without it, everything else falls apart."',cn:'没有它，其他一切都会崩塌。',v:[{w:'without',p:'/wɪˈðaʊt/',m:'没有'},{w:'falls apart',p:'/fɔːlz əˈpɑːrt/',m:'崩塌'}]}
]},
{id:3,title:"The Impatient Student",g:[
{en:'After two weeks, the young man grew restless.',cn:'两周后，年轻人变得不耐烦了。',v:[{w:'restless',p:'/ˈrestləs/',m:'不安的，不耐烦'}]},
{en:'"I have practiced this move for fourteen days. When will I learn something new?"',cn:'这个动作我已经练了14天了，什么时候才能学新的？',v:[{w:'fourteen',p:'/ˌfɔːrˈtiːn/',m:'十四'}]},
{en:'The master picked up a cup and poured water until it overflowed.',cn:'大师拿起一个杯子，倒水直到溢出。',v:[{w:'poured',p:'/pɔːrd/',m:'倒（过去式）'},{w:'overflowed',p:'/ˌoʊvərˈfloʊd/',m:'溢出'}]},
{en:'"Your mind is like this cup," he said.',cn:'他说：你的心就像这个杯子。',v:[{w:'mind',p:'/maɪnd/',m:'心，思维'},{w:'cup',p:'/kʌp/',m:'杯子'}]},
{en:'"It is already full. I cannot pour anything in."',cn:'它已经满了，我倒不进任何东西。',v:[{w:'already',p:'/ɔːlˈredi/',m:'已经'},{w:'full',p:'/fʊl/',m:'满的'}]}
]},
{id:4,title:"The Breaking Point",g:[
{en:'One evening, the young man tried to learn an advanced technique on his own.',cn:'一天傍晚，年轻人自己偷偷学了一个高级技巧。',v:[{w:'advanced',p:'/ədˈvænst/',m:'高级的'},{w:'technique',p:'/tekˈniːk/',m:'技巧'}]},
{en:'He failed again and again.',cn:'他一次又一次地失败。',v:[{w:'failed',p:'/feɪld/',m:'失败（过去式）'}]},
{en:'His hands were sore, and his pride was hurt.',cn:'他的手很痛，自尊心也受了伤。',v:[{w:'sore',p:'/sɔːr/',m:'疼痛的'},{w:'pride',p:'/praɪd/',m:'自尊心'}]},
{en:'The master watched silently from the doorway.',cn:'大师从门口静静地看着。',v:[{w:'silently',p:'/ˈsaɪləntli/',m:'静静地'},{w:'doorway',p:'/ˈdɔːrweɪ/',m:'门口'}]},
{en:'"Now you are ready to learn," the master said quietly.',cn:'大师轻轻说：现在你准备好学习了。',v:[{w:'ready',p:'/ˈredi/',m:'准备好的'},{w:'quietly',p:'/ˈkwaɪətli/',m:'轻轻地'}]},
{en:'"Because now you know that shortcuts do not work."',cn:'因为现在你知道了，捷径是行不通的。',v:[{w:'shortcuts',p:'/ˈʃɔːrtkʌts/',m:'捷径'}]}
]},
{id:5,title:"The Slow Path",g:[
{en:'The young man returned to the basic move.',cn:'年轻人回到了那个基础动作。',v:[{w:'returned',p:'/rɪˈtɜːrnd/',m:'回到（过去式）'},{w:'basic',p:'/ˈbeɪsɪk/',m:'基础的'}]},
{en:'But this time, something was different.',cn:'但这一次，有什么不一样了。',v:[{w:'different',p:'/ˈdɪfrənt/',m:'不同的'}]},
{en:'He noticed things he had never seen before.',cn:'他注意到了以前从未看到的东西。',v:[{w:'noticed',p:'/ˈnoʊtɪst/',m:'注意到（过去式）'}]},
{en:'The angle of his wrist. The shift of his weight. The rhythm of his breath.',cn:'手腕的角度，重心的转移，呼吸的节奏。',v:[{w:'angle',p:'/ˈæŋɡl/',m:'角度'},{w:'rhythm',p:'/ˈrɪðəm/',m:'节奏'}]},
{en:'"I have been doing this wrong for weeks," he whispered.',cn:'他低声说：我这几周一直都做错了。',v:[{w:'whispered',p:'/ˈwɪspərd/',m:'低声说'}]},
{en:'The master smiled and said, "Now you are truly practicing."',cn:'大师笑了：现在你才是在真正练习。',v:[{w:'truly',p:'/ˈtruːli/',m:'真正地'}]}
]},
{id:6,title:"The Competition",g:[
{en:'Months later, a famous teacher came to challenge the master\'s students.',cn:'几个月后，一位名师来挑战大师的学生们。',v:[{w:'challenge',p:'/ˈtʃælɪndʒ/',m:'挑战'},{w:'famous',p:'/ˈfeɪməs/',m:'著名的'}]},
{en:'Everyone was nervous except the young man.',cn:'除了年轻人，所有人都紧张。',v:[{w:'nervous',p:'/ˈnɜːrvəs/',m:'紧张的'},{w:'except',p:'/ɪkˈsept/',m:'除了'}]},
{en:'The famous teacher was fast and powerful.',cn:'那位名师又快又有力。',v:[{w:'powerful',p:'/ˈpaʊərfl/',m:'有力量的'}]},
{en:'But the young man only used his one basic move, slowly and perfectly.',cn:'但年轻人只用他那一个基础动作，缓慢而完美。',v:[{w:'perfectly',p:'/ˈpɜːrfɪktli/',m:'完美地'}]},
{en:'To everyone\'s surprise, nobody could stop it.',cn:'出乎所有人意料，没有人能挡住。',v:[{w:'surprise',p:'/sərˈpraɪz/',m:'意外'}]},
{en:'"How did you win with just one move?" they asked.',cn:'他们问：你怎么只用一招就赢了？',v:[]},
{en:'"Because I practiced it the right way," he said.',cn:'他说：因为我用正确的方式练过它。',v:[]}
]},
{id:7,title:"The Master's Gift",g:[
{en:'Years passed. The young man became a master himself.',cn:'多年后，年轻人自己也成了一代大师。',v:[{w:'himself',p:'/hɪmˈself/',m:'他自己'}]},
{en:'One day, a new student asked him, "How long will it take me to become great?"',cn:'一天，一个新学生问他：我要多久才能成为高手？',v:[]},
{en:'He smiled and said the same words his master had told him long ago: "Ten years."',cn:'他笑了，说出了他大师当年对他说的话：十年。',v:[]},
{en:'"But if you practice the right way, every single day counts."',cn:'但如果你用正确的方式练，每一天都算数。',v:[{w:'counts',p:'/kaʊnts/',m:'算数，有意义'}]},
{en:'"The journey itself is the reward."',cn:'旅程本身就是回报。',v:[{w:'journey',p:'/ˈdʒɜːrni/',m:'旅程'},{w:'reward',p:'/rɪˈwɔːrd/',m:'回报，奖赏'}]},
{en:'The student bowed, and the cycle began again.',cn:'学生鞠躬，循环又开始了。',v:[{w:'bowed',p:'/baʊd/',m:'鞠躬（过去式）'},{w:'cycle',p:'/ˈsaɪkl/',m:'循环'}]}
]},{id:8,title:"A Father's Words",g:[
{en:'Proud of you.',cn:'以你为荣。'},
{en:"You're 8. These are very hard skills — half these college kids can't even do it.",cn:'你才八岁。这些动作非常难——一半的大学生都做不了。'},
{en:"You're not bad. You are learning how to train like an athlete.",cn:'你不差。你正在学怎么像运动员一样训练。'},
{en:'Sometimes you mess up. Mistakes are not bad.',cn:'有时候你会失误。但失误不等于你不好。'},
{en:'Your tongue has the power.',cn:'你的语言有力量。'},
{en:'If you keep telling yourself you are bad, you will be bad.',cn:'如果你一直说自己不行，你就会不行。'},
{en:'But if you tell yourself you are good, you will be good.',cn:'但如果你告诉自己你可以，你就会可以。'},
{en:'Stop putting yourself down.',cn:'停止贬低自己。'},
{en:'I will not tolerate you cutting yourself down.',cn:'我不允许你贬低自己。'},
{en:'Speak highly of yourself to yourself.',cn:'对自己说好话。对自己说不好的话，太疯狂了。'}
]},
{id:9,title:"Never Give Up",g:[
{en:'You can quit if you truly do not like something.',cn:'如果你真的不喜欢，可以放弃。'},
{en:'But you cannot quit because something might be scary.',cn:'但不能因为害怕而放弃。'},
{en:"I'm not going to let you give up on yourself.",cn:'我不会让你放弃自己。'},
{en:"If I've made you feel I don't care about you, I've not done my job as a father.",cn:'如果我让你觉得我不关心你，那是我这个父亲没做好。'},
{en:'I love you so much.',cn:'我非常爱你。'},
{en:"I'll do whatever it takes to make sure you're successful.",cn:'我会不惜一切确保你成功。'},
{en:'The only limits you have are the limits you put on yourself.',cn:'你唯一的限制，是自己给自己设的限制。'},
{en:'If you tell yourself you can achieve something, you will eventually achieve it.',cn:'如果你告诉自己你能做到，哪怕不是立刻——你最终会做到。'},
{en:'You are capable.',cn:'你有这个能力。'}
]},


];

var cd=1,gi=0,p={},au=null;
try{var sv=JSON.parse(localStorage.getItem('ev7')||'{}');p=sv.p||{};cd=sv.cd||1;gi=sv.gi||0}catch(e){}
function s(){try{localStorage.setItem('ev7',JSON.stringify({p:p,cd:cd,gi:gi}))}catch(e){}}

function play(sp){
  if(au){au.pause();au=null}
  au=new Audio(aUrl(cd,gi,sp));
  au.play().catch(function(){});
}

function r(){
  var day=D.find(function(x){return x.id===cd});
  if(!day){cd=1;day=D[0]}
  var gs=day.g,g=gs[gi],t=gs.length;
  // Count total passed
  var tp=0;for(var k in p)tp++;
  var tt=0;D.forEach(function(d){tt+=d.g.length});
  var pct=Math.round(tp/tt*100);
  var allDone=tp===tt;

  var h='';
  // Header
  h+='<div class="top"><h1>🦞 <em>龙哥英语</em></h1></div>';

  // Day tabs
  h+='<div class="tabs">';
  D.forEach(function(d){
    var done=0;
    d.g.forEach(function(_,i){if(p[d.id+'_'+i])done++});
    var label='D'+d.id+(done===d.g.length?' ✓':'');
    h+='<button class="tab'+(cd===d.id?' on':'')+'" onclick="swDay('+d.id+')">'+label+'</button>';
  });
  h+='</div>';

  // Progress
  h+='<div class="pbar"><div class="pbar-i"><div class="pbar-f" style="width:'+pct+'%"></div></div><div class="pt">'+tp+'/'+tt+' 已过关</div></div>';

  if(allDone){
    h+='<div class="card dn"><i>🎉</i><h2>全部完成！</h2><p>9天，3个故事，你全部背完了！</p>';
    h+='<div class="bs" style="margin-top:12px"><button class="b bg" style="max-width:180px;margin:0 auto" onclick="p={};cd=1;gi=0;s();r()">🔁 重来</button></div></div>';
  }else{
    h+='<div class="card">';
    h+='<div class="st">📖 The Master — '+day.title+'</div>';
    h+='<div class="sl">Day '+cd+' · 第 '+(gi+1)+' / '+t+' 组</div>';
    h+='<div class="en">'+g.en+'</div>';
    h+='<div class="cn">'+g.cn+'</div>';
    if(g.v&&g.v.length){
      h+='<div class="vt">📝 生词</div>';
      g.v.forEach(function(x){h+='<div class="vi"><div><span class="vw">'+x.w+'</span><span class="vp">'+x.p+'</span></div><div class="vm">'+x.m+'</div></div>'});
    }
    h+='<div class="bs"><button class="b bg" onclick="play(\'n\')">▶ 正常速</button><button class="b bb" onclick="play(\'s\')">🐢 0.5倍速</button></div>';
    h+='<div class="rb" id="rb"></div>';
    h+='<div class="bs"><button class="b bg" onclick="mp()">✅ 过关</button><button class="b br" onclick="mf()">❌ 再练</button></div>';
    h+='<div class="nav"><button class="b bb" onclick="pv()"'+(gi===0&&cd===1?' disabled style="opacity:.3"':'')+'>⬅ 上一组</button><button class="b bg" onclick="nx()">下一组 ➡</button></div>';
    h+='</div>';
  }
  h+='<div class="tip">💡 听3遍正常速 → 听2遍0.5倍速 → 跟读 → 点过关</div>';
  document.getElementById('a').innerHTML=h;
}

function swDay(d){cd=d;gi=0;s();r()}
function mp(){p[cd+'_'+gi]=1;s();var e=document.getElementById('rb');e.className='rb s ok';e.textContent='✅ 过关！';setTimeout(function(){nx()},600)}
function mf(){var e=document.getElementById('rb');e.className='rb s no';e.textContent='❌ 再听几遍慢速版！'}
function nx(){
  if(au){au.pause();au=null}
  var day=D.find(function(x){return x.id===cd});
  if(gi<day.g.length-1){gi++;s();r()}
  else if(cd<7){cd++;gi=0;s();r()}
  else r();
}
function pv(){
  if(au){au.pause();au=null}
  if(gi>0){gi--;s();r()}
  else if(cd>1){cd--;var day=D.find(function(x){return x.id===cd});gi=day.g.length-1;s();r()}
}
r();
</script>
</body>
</html>
